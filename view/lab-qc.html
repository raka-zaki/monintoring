<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lab QC</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

<!-- Gerbang PIN -->
<div id="pinOverlay" class="role-overlay">
  <div class="role-box">
    <h2 class="role-title">Lab QC</h2>
    <p class="role-subtitle mb-3">Masukin PIN untuk akses halaman ini.</p>
    <input type="password" id="pinInput" class="form-control form-control-sm field-dark mb-2" placeholder="PIN" inputmode="numeric">
    <button type="button" class="btn-role w-100" onclick="checkPin()">Masuk</button>
    <a href="../index.html" class="btn btn-danger font-weight-bold w-100 mt-2">Kembali</a>
    <p id="pinError" class="form-error mt-2 d-none">PIN salah, coba lagi.</p>
  </div>
</div>

<div class="dash-wrap d-none" id="labQcContent">

  <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
    <div>
      <h1 class="brand-title mb-0">Lab QC</h1>
      <p class="brand-subtitle mb-0">Cek Campuran &middot; Realtime</p>
    </div>
    <div class="d-flex align-items-center gap-2">
      <button type="button" class="back-link" onclick="lockAgain()">Kunci lagi</button>
      <div class="clock-badge" id="clockBadge">--:--:--</div>
    </div>
  </div>

  <div class="row g-3">

    <!-- KIRI: CARD MIXER -->
    <div class="col-12 col-md-7 col-lg-8">
      <div class="panel-card">
        <h2 class="panel-title">Mixer</h2>
        <div class="row g-2" id="allMixerGrid"></div>
      </div>
    </div>

    <!-- KANAN: AKSI + FILTER + EXCEL + CHAT -->
    <div class="col-12 col-md-5 col-lg-4">

      <!-- AKSI -->
      <div class="panel-card mb-3">
        <h2 class="panel-title">Aksi</h2>
        <div id="actionButtons" class="action-buttons"></div>
      </div>

      <!-- FILTER (HORIZONTAL) -->
      <div class="panel-card mb-3">
        <h2 class="panel-title">Filter Data</h2>
        <div class="filter-row">
          <div class="filter-item">
            <label class="form-label-sm">Tanggal</label>
            <input type="date" id="dateFilter" class="form-control form-control-sm field-dark">
          </div>
          <div class="filter-item">
            <label class="form-label-sm">Produk</label>
            <select id="produkFilter" class="form-select form-select-sm field-dark">
              <option value="">Semua</option>
              <option value="A">Mocca</option>
              <option value="A-MF">Moccafrio</option>
              <option value="B">Cappu</option>
            </select>
          </div>
          <div class="filter-item">
            <label class="form-label-sm">Shift</label>
            <select id="shiftFilter" class="form-select form-select-sm field-dark">
              <option value="">Semua</option>
              <option value="1">Shift 1</option>
              <option value="2">Shift 2</option>
              <option value="3">Shift 3</option>
            </select>
          </div>
        </div>
      </div>

      <!-- DOWNLOAD -->
      <div class="panel-card mb-3">
        <button type="button" class="btn-print w-100" onclick="downloadLabQcSpreadsheet()">Download (Excel)</button>
      </div>

      <!-- CHAT -->
      <div class="panel-card">
        <h2 class="panel-title">Chat Operator</h2>
        <div class="chat-tabs">
          <button type="button" class="chat-tab active" id="chatTabA">Moccacino & Moccafrio</button>
          <button type="button" class="chat-tab" id="chatTabB">Cappucino</button>
        </div>
        <div class="chat-container">
          <div class="chat-messages" id="chatMessages">
            <p class="chat-empty">Belum ada chat hari ini.</p>
          </div>
          <div class="chat-input-wrap">
            <input type="text" id="chatInput" class="chat-input" placeholder="Ketik pesan..." maxlength="200">
            <button type="button" id="chatSendBtn" class="chat-send-btn">Kirim</button>
          </div>
        </div>
      </div>

    </div>

  </div>
</div>

<template id="mixerIconTpl">
  <svg viewBox="0 0 120 90" class="mixer-icon">
    <circle cx="18" cy="45" r="12" fill="none" stroke="currentColor" stroke-width="2"/>
    <rect x="32" cy="45" y="35" width="16" height="20" rx="3" fill="none" stroke="currentColor" stroke-width="2"/>
    <rect x="48" y="30" width="60" height="30" rx="8" fill="none" stroke="currentColor" stroke-width="2"/>
    <line x1="66" y1="60" x2="62" y2="78" stroke="currentColor" stroke-width="2"/>
    <line x1="90" y1="60" x2="94" y2="78" stroke="currentColor" stroke-width="2"/>
  </svg>
</template>

<!-- Toast Lab QC -->
<div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 2100;">
  <div id="labToast" class="toast op-toast align-items-center border-0" role="alert" aria-live="assertive" aria-atomic="true">
    <div class="d-flex">
      <div class="toast-body" id="labToastBody">Selesai</div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="../assets/js/firebase-config.js"></script>
<script src="../assets/js/chat.js"></script>
<script src="../assets/js/lab-qc.js"></script>
</body>
</html>

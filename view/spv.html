<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Overview Batch</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<!-- Gerbang PIN -->
<div id="pinOverlay" class="role-overlay">
  <div class="role-box">
    <h2 class="role-title">Overview Batch</h2>
    <p class="role-subtitle mb-3">Masukin PIN untuk akses halaman ini.</p>
    <input type="password" id="pinInput" class="form-control form-control-sm field-dark mb-2" placeholder="PIN" inputmode="numeric">
    <button type="button" class="btn-role w-100" onclick="checkPin()">Masuk</button>
    <a href="../index.html" class="btn btn-danger font-weight-bold w-100 mt-2">Kembali</a>
    <p id="pinError" class="form-error mt-2 d-none">PIN salah, coba lagi.</p>
  </div>
</div>

<div class="dash-wrap d-none" id="spvContent">

  <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
    <div>
      <h1 class="brand-title mb-0">Overview Batch</h1>
      <p class="brand-subtitle mb-0">Semua line &middot; Realtime</p>
    </div>
    <div class="d-flex align-items-center gap-2">
      <button type="button" class="back-link" onclick="lockAgain()">Kunci lagi</button>
      <div class="clock-badge" id="clockBadge">--:--:--</div>
    </div>
  </div>

  <!-- STATUS REAL-TIME -->
  <div class="panel-card mb-4">
    <h2 class="panel-title">Status mixer sekarang</h2>
    <div id="allMixerGrid"></div>
  </div>

  <!-- RIWAYAT + FILTER -->
  <div class="panel-card">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
      <h2 class="panel-title mb-0">Riwayat batch</h2>
      <div>
        <label class="form-label-sm">Produk</label>
        <select id="produkFilter" class="form-select form-select-sm">
          <option value="">Semua</option>
          <option value="A">Mocca</option>
          <option value="A-MF">Moccafrio</option>
          <option value="B">Cappu</option>
        </select>
      </div>
      <div>
        <label class="form-label-sm">Shift</label>
        <select id="shiftFilter" class="form-select form-select-sm">
          <option value="">Semua</option>
          <option value="1">Shift 1</option>
          <option value="2">Shift 2</option>
          <option value="3">Shift 3</option>
        </select>
      </div>
      <div class="d-flex align-items-center gap-2">
        <input type="date" id="dateFilter" class="form-control form-control-sm field-dark" style="width:auto">
        <button type="button" class="btn-print" onclick="downloadSpvSpreadsheet()">Download (Excel)</button>
      </div>
    </div>
    <div class="table-responsive rekap-scroll">
      <table class="table table-sm rekap-table mb-0">
        <thead>
          <tr>
            <th>Line</th>
            <th>Mixer</th>
            <th>Tanggal</th>
            <th>Shift</th>
            <th>Jam Tuang Mikro</th>
            <th>Jam Sampling</th>
            <th>Jam QC OK</th>
            <th>Jam Discharge</th>
            <th>Batch</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="spvRekapBody">
          <tr><td colspan="10" class="text-center empty-note">Belum ada data</td></tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<template id="mixerIconTpl">
  <svg viewBox="0 0 120 90" class="mixer-icon">
    <circle cx="18" cy="45" r="12" fill="none" stroke="currentColor" stroke-width="2"/>
    <rect x="32" cy="45" y="35" width="16" height="20" rx="3" fill="none" stroke="currentColor" stroke-width="2"/>
    <rect x="48" y="30" width="60" height="30" rx="8" fill="none" stroke="currentColor" stroke-width="2"/>
    <line x1="66" y1="60" x2="62" y2="78" stroke="currentColor" stroke-width="2"/>
    <line x1="90" y1="60" x2="94" y2="78" stroke="currentColor" stroke-width="2"/>
  </svg>
</template>

<!-- Modal Edit Batch -->
<div class="modal fade" id="editBatchModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content action-modal-content">
      <div class="modal-header border-0">
        <h5 class="modal-title">Edit Batch — <span id="editBatchTitle"></span></h5>
      </div>
      <div class="modal-body">
        <div class="mb-2">
          <label class="form-label-sm">Tanggal</label>
          <input type="date" id="editTanggal" class="form-control form-control-sm field-dark">
        </div>
        <div class="mb-2">
          <label class="form-label-sm">Shift</label>
          <select id="editShift" class="form-select form-select-sm field-dark">
            <option value="1">Shift 1</option>
            <option value="2">Shift 2</option>
            <option value="3">Shift 3</option>
          </select>
        </div>
        <div class="mb-2">
          <label class="form-label-sm">Jam Tuang Mikro</label>
          <input type="text" id="editJamTuang" class="form-control form-control-sm field-dark" placeholder="08:00">
        </div>
        <div class="mb-2">
          <label class="form-label-sm">Jam Sampling</label>
          <input type="text" id="editJamSampling" class="form-control form-control-sm field-dark" placeholder="08:15">
        </div>
        <div class="mb-2">
          <label class="form-label-sm">Jam QC OK</label>
          <input type="text" id="editJamQcOk" class="form-control form-control-sm field-dark" placeholder="08:20">
        </div>
        <div class="mb-2">
          <label class="form-label-sm">Jam Discard</label>
          <input type="text" id="editJamDiscard" class="form-control form-control-sm field-dark" placeholder="08:25">
        </div>
      </div>
      <div class="modal-footer border-0">
        <button type="button" class="btn-mini btn-sampling" data-bs-dismiss="modal">Batal</button>
        <button type="button" class="btn-mini btn-tuang" onclick="confirmEditBatch()">Simpan</button>
      </div>
    </div>
  </div>
</div>

<!-- Toast SPV -->
<div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 2100;">
  <div id="spvToast" class="toast op-toast align-items-center border-0" role="alert" aria-live="assertive" aria-atomic="true">
    <div class="d-flex">
      <div class="toast-body" id="spvToastBody">Selesai</div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="assets/js/firebase-config.js"></script>
<script src="assets/js/spv.js"></script>
</body>
</html>
